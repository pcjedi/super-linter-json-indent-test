---
name: Lint

on: # yamllint disable-line rule:truthy
  # push: null
  pull_request: null

permissions:
  contents: read

jobs:
  fix-lint-issues:
    permissions:
      # To write linting fixes
      contents: write
      # To write Super-linter status checks
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Super-Linter
        uses: super-linter/super-linter@v8.5.0 # x-release-please-version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          FAIL_ON_CONFLICTING_TOOLS_ENABLED: true
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_CSS: false
          VALIDATE_CSS_PRETTIER: false
          VALIDATE_GRAPHQL_PRETTIER: false
          VALIDATE_HTML_PRETTIER: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_JSON: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_JSONC: false
          VALIDATE_JSONC_PRETTIER: false
          VALIDATE_JSX: false
          VALIDATE_JSX_PRETTIER: false
          VALIDATE_TSX: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_TYPESCRIPT_PRETTIER: false
          VALIDATE_VUE: false
          VALIDATE_VUE_PRETTIER: false
          FIX_ANSIBLE: true
          FIX_BIOME_FORMAT: true
          FIX_BIOME_LINT: true
          FIX_CLANG_FORMAT: true
          FIX_CSHARP: true
          FIX_CSS_PRETTIER: false
          FIX_CSS: false
          FIX_DOTNET_SLN_FORMAT_ANALYZERS: true
          FIX_DOTNET_SLN_FORMAT_STYLE: true
          FIX_DOTNET_SLN_FORMAT_WHITESPACE: true
          FIX_ENV: true
          FIX_GITHUB_ACTIONS_ZIZMOR: true
          FIX_GO_MODULES: true
          FIX_GO: true
          FIX_GOOGLE_JAVA_FORMAT: true
          FIX_GRAPHQL_PRETTIER: false
          FIX_GROOVY: true
          FIX_HTML_PRETTIER: false
          FIX_JAVASCRIPT_ES: false
          FIX_JAVASCRIPT_PRETTIER: false
          FIX_JSON_PRETTIER: false
          FIX_JSON: false
          FIX_JSONC: false
          FIX_JSONC_PRETTIER: false
          FIX_JSX_PRETTIER: false
          FIX_JSX: false
          FIX_JUPYTER_NBQA_BLACK: false
          FIX_JUPYTER_NBQA_ISORT: true
          FIX_JUPYTER_NBQA_RUFF: true
          FIX_KOTLIN: true
          FIX_MARKDOWN_PRETTIER: true
          FIX_MARKDOWN: true
          FIX_NATURAL_LANGUAGE: true
          FIX_POWERSHELL: true
          FIX_PROTOBUF: true
          FIX_PYTHON_BLACK: false
          FIX_PYTHON_ISORT: true
          FIX_PYTHON_RUFF: true
          FIX_PYTHON_RUFF_FORMAT: true
          FIX_RUBY: true
          FIX_RUST_2015: true
          FIX_RUST_2018: true
          FIX_RUST_2021: true
          FIX_RUST_2024: true
          FIX_RUST_CLIPPY: true
          FIX_SCALAFMT: true
          FIX_SHELL_SHFMT: true
          FIX_SNAKEMAKE_SNAKEFMT: true
          FIX_SPELL_CODESPELL: true
          FIX_SQLFLUFF: true
          FIX_TERRAFORM_FMT: true
          FIX_TSX: false
          FIX_TYPESCRIPT_ES: false
          FIX_TYPESCRIPT_PRETTIER: false
          FIX_VUE: false
          FIX_VUE_PRETTIER: false
          FIX_YAML_PRETTIER: true
      - shell: bash
        # if: always() && github.event_name == 'pull_request'
        run: |
          git config --global user.email super-linter@users.noreply.github.com
          git config --global user.name super-linter
          git checkout "$GITHUB_HEAD_REF"
          git branch --set-upstream-to=origin/"$GITHUB_HEAD_REF"
          git commit -m "chore(super-linter): close and reopen PR now" || echo "nothing to commit (linter)"
          git stash
          git pull --rebase
          git push
